[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "marsgis"
version = "0.1.0"
description = "Multi-criteria (AHP + weighted overlay) landing-site suitability analysis for equatorial Mars"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mohamed Jihed Fradi" }]
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pandas", "rasterio", "geopandas", "shapely", "pyproj", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
